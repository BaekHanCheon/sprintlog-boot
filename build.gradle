plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sprintlog'
version = '0.0.1-SNAPSHOT'
description = 'sprintlog-boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 응답에 _links(자기 자신 연관 리소스로 가는 링크)를 붙여주는 HATEOAS 라이브러리
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'

    // Spring AOP - @Aspect / @Around 로 횡단 관심사 (로깅, 실행시간) 분리.
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Actuator - 애플리케이션 모니터링 (상태, 정보, 지표)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    // [신규] Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // 테스트 코드에서도 Lombok 사용
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Swagger/OpenAPI 추가
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // 쿼리 파라미터 추가 외부 로그 남기기 (콘솔에서 sql 자세히 보기)
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

    //AWS SDK for Java v2 (S3Client로 업로드/삭제, S3Presigner로 presigned URL)
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:s3'

    // Adobe S3Mock - 로컬에서 진짜 S3 API 를 흉내내는 컨테이너.
    //   계정/토큰 불필요(LocalStack 은 2026-03 부터 토큰 필요) → S3 연동을 격리·재현 가능하게 테스트.
    testImplementation 'com.adobe.testing:s3mock-testcontainers:4.11.0'

}

tasks.named('test') {
    useJUnitPlatform()
}
