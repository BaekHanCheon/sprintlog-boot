# 운영 환경 (prod profile) 추가 설정 : 컨테이너/클라우드 배포용 외부 설정
# application.yml의 값들을 덮어쓰거나 보강
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/sprintlog} #db: 컨테이너를 같은 네트워크로 묶고, DB컨테이너의 이름을 db로 지을것
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

sprintlog:
  welcome-message: "SprintLog Boot - PRODUCTION (운영 환경)"
  sample-data:
    enabled: false
    count: 4
  file-directory: ${SPRINTLOG_FILE_DIRECTORY:/app/uploads} #컨테이너 안 경로 (호스트 절대경로 대신)

# 개발 시에는 자세한 로그가 도움됨.
logging:
  level:
    com.sprintlog: warn
