# 운영 환경 (prod profile) 추가 설정 : 컨테이너/클라우드 배포용 외부 설정
# application.yml의 값들을 덮어쓰거나 보강
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/sprintlog} #db: 컨테이너를 같은 네트워크로 묶고, DB컨테이너의 이름을 db로 지을것
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10 # (CPU 코어 수 X 2) + 유효 디스크 수
      connection-timeout: 10000 #풀에서 커넥션을 가져오는 데 걸리는 최대 대기 시간 : 10초
      max-lifetime: 1740000 #커넥션 객체의 최대 수명을 지정: 29분 (30초 ~ N분 추천)
      keepalive-time: 300000 # 5분 / 풀 안에서 놀고있는(유휴)커넥션에게 주기적으로 health check를 보내는 간격
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

sprintlog:
  welcome-message: "SprintLog Boot - PRODUCTION (운영 환경)"
  sample-data:
    enabled: false
    count: 4
  file-directory: ${SPRINTLOG_FILE_DIRECTORY:/app/uploads} #컨테이너 안 경로 (호스트 절대경로 대신)

  storage: ${SPRINTLOG_STORAGE:s3}  # s3, local
  s3:
    bucket: ${SPRINTLOG_S3_BUCKET:sprintlog-uploads}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${SPRINTLOG_S3_ENDPOINT:}
    presign-minutes: ${SPRINTLOG_S3_PRISIGN_MINUTES:5}

# 개발 시에는 자세한 로그가 도움됨.
logging:
  level:
    root: info
    com.sprintlog: warn
