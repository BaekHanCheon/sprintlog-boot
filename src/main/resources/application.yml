# SprintLog Boot의 기본 설정 파일
# Spring Boot가 초기화 될 때 항상 이 파일을 읽는다.
info:
  app:
    name: SprintLog
    description: 학습 기록 서비스
    version: 1.0.0
    encoding: UTF-8
    java-version: 17

  company:
    name: MyCompany
    email: support@mycompany.com
    website: https://mycompany.com

  team:
    developer: Backend Team
    manager: John Doe
    contact: backend-team@mycompany.com

spring:
  application:
    name: sprintlog-boot

  profiles:
    active: dev

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    session:
      # 세션 타임아웃 - 이 시간 동안 요청이 없으면 세션이 만료된다 (기본 30분)
      # 만료된 세션 쿠키로 다시 접근하면 '무효 세션' 처리되어 invalidSessionUrl로 넘어감
      timeout: 30m
      cookie:
        http-only: true #JSESSIONID 쿠키를 JS로 읽지 못하게 (XSS 세션 탈취 방어)
        secure: false # https 환경에서만 JSESSIONID 쿠키를 전달

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics # 꼭 필요한 정보만 노출
      base-path: /management #경로도 바꿔서 숨김
  endpoint:
    health:
      show-details: always #개발 환경에선 always, 운영에서는 when_authorized
  info:
    env:
      show-details: always
  server:
    port: 9090

springdoc:
  swagger-ui:
    path: /api-docs-ui.html # UI page 경로
    tags-sorter: alpha # 태그 정렬 방식 (알파벳순)
    operations-sorter: method # 메서드 정렬 방식
    display-request-duration: true # 요청과 응답에 소요된 시간 표시
    doc-expansion: list # 문서 펼침 상태 (none, list, full)

  api-docs:
    path: /my-api # Swagger가 우리 API의 정보를 얻어오기 위해서 요청하는 url

sprintlog:
  welcome-message: "SprintLog Boot - 외부 설정 시연(기본)"
  sample-data:
    enabled: true
    count: 4
  file-directory: /Users/stephen/Desktop/codeit-13th-develop/spring-upload

